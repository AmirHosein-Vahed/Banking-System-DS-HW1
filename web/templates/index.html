{% extends "base.html" %}
{% block content %}
<h1>Dashboard</h1>
<p class="subtitle">Real-time account balances from banking servers.</p>
<div class="grid">
  {% for a,b in balances.items() %}
  <div class="stat">
    <small>{{ a }}</small>
    <strong>{{ b }}</strong>
  </div>
  {% endfor %}
</div>
<div class="card">
  <p><strong>Servers:</strong> {{ servers|join(", ") }}</p>
</div>
{% endblock %}
